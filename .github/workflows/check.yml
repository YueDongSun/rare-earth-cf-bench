name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: sync
        run: uv sync --frozen
      - name: check
        run: make check
